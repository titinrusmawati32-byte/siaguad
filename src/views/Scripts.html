<script>
  /**
   * SiAGU Client Runtime & State Management
   */

  const AppState = {
    currentView: 'dashboard',
    activeRole: 'teacher', // 'teacher' atau 'headmaster'
    currentUser: null,
    config: {},
    classes: [],
    subjects: [],
    students: [],
    cache: {
      documents: null,
      journals: null,
      attendance: {},
      assessments: null,
      summary: {}
    },
    viewsLoaded: {},
    isLoading: false
  };

  /**
   * Konfigurasi API Endpoint Google Apps Script
   * Jika dijalankan di GitHub Pages / Server mandiri, menggunakan URL Deployment Web App
   */
  const API_CONFIG = {
    GAS_URL: (typeof localStorage !== 'undefined' && localStorage.getItem('siagu_gas_api_url')) || ''
  };

  /**
   * Promise wrapper untuk memanggil fungsi server:
   * - Otomatis menggunakan google.script.run jika di dalam Google Apps Script
   * - Otomatis menggunakan fetch(API_CONFIG.GAS_URL) jika dijalankan di GitHub Pages / Luar GAS
   */
  function runServer(functionName, ...args) {
    return new Promise((resolve, reject) => {
      // 1. Jika berjalan langsung di dalam lingkungan Google Apps Script
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((response) => {
            if (response && response.success === false) {
              reject(new Error(response.error || 'Terjadi kesalahan server'));
            } else {
              resolve(response);
            }
          })
          .withFailureHandler((err) => {
            reject(err);
          })[functionName](...args);
        return;
      }

      // 2. Jika berjalan di GitHub Pages atau Browser Standalone
      let apiUrl = API_CONFIG.GAS_URL || (typeof localStorage !== 'undefined' && localStorage.getItem('siagu_gas_api_url'));

      if (!apiUrl || !apiUrl.startsWith('https://script.google.com')) {
        const inputUrl = prompt(
          '🔌 SINKRONISASI DATABASE GOOGLE APPS SCRIPT:\n\n' +
          'Aplikasi saat ini berjalan di GitHub Pages / Server Mandiri.\n' +
          'Silakan tempelkan Web App URL Google Apps Script Anda:\n' +
          '(Contoh: https://script.google.com/macros/s/AKfycb.../exec)'
        );

        if (inputUrl && inputUrl.trim().startsWith('https://script.google.com')) {
          apiUrl = inputUrl.trim();
          localStorage.setItem('siagu_gas_api_url', apiUrl);
          API_CONFIG.GAS_URL = apiUrl;
        } else {
          return reject(new Error('Web App URL Google Apps Script belum diisi.'));
        }
      }

      // Kirim request ke Google Apps Script via POST (Text/Plain untuk bypass preflight CORS)
      fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: functionName,
          args: args
        }),
        redirect: 'follow'
      })
      .then(async (res) => {
        const text = await res.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          throw new Error('Respons backend bukan JSON: ' + text.substring(0, 100));
        }
      })
      .then((response) => {
        if (response && response.success === false) {
          reject(new Error(response.error || 'Terjadi kesalahan pada server'));
        } else {
          resolve(response);
        }
      })
      .catch((err) => {
        reject(err);
      });
    });
  }

  /**
   * Sistem Notifikasi Toast
   */
  function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const bgColors = {
      success: 'bg-emerald-600 text-white',
      error: 'bg-rose-600 text-white',
      warning: 'bg-amber-600 text-white',
      info: 'bg-sky-600 text-white'
    };

    const icons = {
      success: 'check-circle-2',
      error: 'alert-circle',
      warning: 'alert-triangle',
      info: 'info'
    };

    toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${bgColors[type] || bgColors.info}`;
    toast.innerHTML = `
      <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 flex-shrink-0"></i>
      <span class="flex-1">${message}</span>
      <button onclick="this.parentElement.remove()" class="opacity-80 hover:opacity-100">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    `;

    container.appendChild(toast);
    lucide.createIcons();

    // Trigger animasi muncul
    requestAnimationFrame(() => {
      toast.classList.remove('translate-y-2', 'opacity-0');
    });

    // Auto dismiss dalam 4 detik
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-2');
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  /**
   * Tampilkan / Sembunyikan Loading
   * - Operasi Mutasi (Simpan/Upload/Hapus): Menampilkan modal overlay penuh
   * - Navigasi Menu / Browsing: Menggunakan progress bar halus di tepi atas layar tanpa memblokir klik
   */
  function setLoading(show, text = 'Memuat data...', forceModal = false) {
    AppState.isLoading = show;
    const overlay = document.getElementById('global-loading-overlay');
    const loadingText = document.getElementById('global-loading-text');
    const progressBar = document.getElementById('top-progress-bar');

    const isMutationAction = forceModal || /(simpan|unggah|upload|hapus|delete|autentikasi|login|hubungkan)/i.test(text);

    if (show) {
      if (isMutationAction) {
        if (loadingText) loadingText.textContent = text;
        if (overlay) overlay.classList.remove('hidden');
      } else {
        if (progressBar) progressBar.classList.remove('-translate-y-full');
      }
    } else {
      if (overlay) overlay.classList.add('hidden');
      if (progressBar) progressBar.classList.add('-translate-y-full');
    }
  }

  /**
   * Router Tampilan Instan & Responsif (Switch Views)
   */
  function switchView(viewName, forceRefresh = false) {
    // 1. Tampilkan panel target secara instan (0 milidetik - Snappy SPA)
    const views = document.querySelectorAll('.view-panel');
    views.forEach(v => v.classList.add('hidden'));

    const target = document.getElementById(`view-${viewName}`);
    if (target) {
      target.classList.remove('hidden');
      AppState.currentView = viewName;
    }

    // 2. Perbarui status tombol aktif di navigasi sidebar
    const navItems = document.querySelectorAll('.nav-btn');
    navItems.forEach(btn => {
      const btnView = btn.getAttribute('data-view');
      if (btnView === viewName) {
        btn.classList.add('nav-active');
        btn.classList.remove('text-slate-400', 'hover:text-white', 'hover:bg-white/[0.05]');
      } else {
        btn.classList.remove('nav-active');
        btn.classList.add('text-slate-400', 'hover:text-white', 'hover:bg-white/[0.05]');
      }
    });

    // 3. Efisiensi Caching: Muat data server hanya jika belum pernah dimuat atau diminta refresh
    const alreadyLoaded = AppState.viewsLoaded[viewName];
    if (!alreadyLoaded || forceRefresh) {
      AppState.viewsLoaded[viewName] = true;
      if (viewName === 'manage-users' && window.loadManageUsersView) {
        window.loadManageUsersView();
      } else if (window[`load${capitalize(viewName)}View`]) {
        window[`load${capitalize(viewName)}View`]();
      }
    }

    // 4. Render ulang ikon Lucide
    setTimeout(() => lucide.createIcons(), 30);
  }

  function capitalize(str) {
    if (!str) return '';
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  /**
   * Inisialisasi Aplikasi Saat Halaman Selesai Dimuat
   */
  document.addEventListener('DOMContentLoaded', async () => {
    lucide.createIcons();

    // Event listener menu navigasi sidebar
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const view = btn.getAttribute('data-view');
        if (view) switchView(view);
      });
    });

    // Cek status sesi login pengguna di browser
    checkAuthSession();
  });

  /**
   * Pengecekan Sesi Login di LocalStorage
   */
  function checkAuthSession() {
    const savedUserJson = localStorage.getItem('siagu_auth_user');
    const loginView = document.getElementById('view-login');
    const appLayout = document.getElementById('app-layout');

    if (savedUserJson) {
      try {
        const user = JSON.parse(savedUserJson);
        applyAuthenticatedUser(user);
      } catch (e) {
        localStorage.removeItem('siagu_auth_user');
        if (loginView) loginView.classList.remove('hidden');
        if (appLayout) appLayout.classList.add('hidden');
      }
    } else {
      if (loginView) loginView.classList.remove('hidden');
      if (appLayout) appLayout.classList.add('hidden');
      lucide.createIcons();
    }
  }

  /**
   * Terapkan profil pengguna yang terotentikasi & proteksi hak akses menu
   */
  async function applyAuthenticatedUser(user) {
    AppState.currentUser = user;
    AppState.activeRole = user.role; // 'guru' atau 'headmaster'

    const loginView = document.getElementById('view-login');
    const appLayout = document.getElementById('app-layout');
    const navSpv = document.getElementById('nav-btn-supervision');
    const navUsers = document.getElementById('nav-btn-users');
    const roleBadge = document.getElementById('sidebar-role-badge');
    const mobileRole = document.getElementById('mobile-role-label');

    if (loginView) loginView.classList.add('hidden');
    if (appLayout) appLayout.classList.remove('hidden');

    // Role-based visibility
    if (user.role === 'headmaster') {
      if (navSpv) navSpv.classList.remove('hidden');
      if (navUsers) navUsers.classList.remove('hidden');
      if (roleBadge) roleBadge.textContent = 'Portal Kepala Sekolah';
      if (mobileRole) mobileRole.textContent = 'Kepala Sekolah';
    } else {
      if (navSpv) navSpv.classList.add('hidden');
      if (navUsers) navUsers.classList.add('hidden');
      if (roleBadge) roleBadge.textContent = 'Portal Guru';
      if (mobileRole) mobileRole.textContent = 'Guru Pengampu';
    }

    // Ambil payload konfigurasi sekolah
    await loadInitialAppData();

    // Arahkan ke view default sesuai peran
    if (user.role === 'headmaster') {
      switchView('supervision');
    } else {
      switchView('dashboard');
    }

    lucide.createIcons();
  }

  /**
   * Buka Tampilan Halaman Login / Ganti Akun
   */
  function goToLoginPage() {
    const loginView = document.getElementById('view-login');
    const appLayout = document.getElementById('app-layout');
    const returnBtn = document.getElementById('btn-return-app');

    if (appLayout) appLayout.classList.add('hidden');
    if (loginView) loginView.classList.remove('hidden');
    if (returnBtn && AppState.currentUser) {
      returnBtn.classList.remove('hidden');
    }
    lucide.createIcons();
  }

  /**
   * Batalkan login & kembali ke dashboard aplikasi
   */
  function cancelLoginAndReturn() {
    if (AppState.currentUser) {
      const loginView = document.getElementById('view-login');
      const appLayout = document.getElementById('app-layout');
      if (loginView) loginView.classList.add('hidden');
      if (appLayout) appLayout.classList.remove('hidden');
      lucide.createIcons();
    }
  }

  /**
   * Keluar / Logout dari Aplikasi
   */
  function handleLogout() {
    if (!confirm('Apakah Anda yakin ingin keluar dari sistem?')) return;

    localStorage.removeItem('siagu_auth_user');
    localStorage.removeItem('siagu_auth_token');
    AppState.currentUser = null;

    const loginView = document.getElementById('view-login');
    const appLayout = document.getElementById('app-layout');

    if (appLayout) appLayout.classList.add('hidden');
    if (loginView) loginView.classList.remove('hidden');

    document.getElementById('login-password').value = '';
    showToast('Sesi telah diakhiri. Sampai jumpa kembali!', 'info');
    lucide.createIcons();
  }

  /**
   * Memuat konfigurasi profil sekolah dan data master
   */
  async function loadInitialAppData() {
    try {
      setLoading(true, 'Menghubungkan ke Google Spreadsheet...');
      const res = await runServer('getInitialAppPayload');
      if (res && res.data) {
        AppState.config = res.data.config || {};
        AppState.classes = res.data.classes || [];
        AppState.subjects = res.data.subjects || [];

        // Update teks profil guru & sekolah di header
        updateHeaderInfo();

        // Refresh dashboard jika berada di dashboard
        if (AppState.currentView === 'dashboard' && window.loadDashboardView) {
          window.loadDashboardView();
        }
      }
    } catch (err) {
      console.error('Gagal memuat konfigurasi awal:', err);
      showToast('Gagal terhubung: ' + err.message, 'error');
    } finally {
      setLoading(false);
    }
  }

  function updateHeaderInfo() {
    const schoolEl = document.getElementById('header-school-name');
    const teacherEl = document.getElementById('header-teacher-name');
    const roleTitleEl = document.getElementById('header-role-title');
    const curriEl = document.getElementById('header-curriculum-badge');
    const avatarEl = document.getElementById('header-user-avatar');

    if (schoolEl && AppState.config.SCHOOL_NAME) schoolEl.textContent = AppState.config.SCHOOL_NAME;
    if (curriEl && AppState.config.CURRICULUM_MODE) curriEl.textContent = AppState.config.CURRICULUM_MODE;

    if (AppState.currentUser) {
      if (teacherEl) teacherEl.textContent = AppState.currentUser.name;
      if (roleTitleEl) roleTitleEl.textContent = AppState.currentUser.title;

      if (avatarEl) {
        if (AppState.currentUser.role === 'headmaster') {
          avatarEl.className = 'w-9 h-9 rounded-2xl bg-gradient-to-tr from-amber-400 to-orange-500 text-slate-950 font-black flex items-center justify-center text-xs shadow-md shadow-amber-500/20';
          avatarEl.innerHTML = '<i data-lucide="shield-check" class="w-4 h-4"></i>';
        } else {
          avatarEl.className = 'w-9 h-9 rounded-2xl bg-gradient-to-tr from-sky-400 to-blue-600 text-slate-950 font-black flex items-center justify-center text-xs shadow-md shadow-sky-500/20';
          avatarEl.innerHTML = '<i data-lucide="user" class="w-4 h-4"></i>';
        }
      }
    }
    lucide.createIcons();
  }

  /**
   * Beralih Peran antara Guru dan Kepala Sekolah
   */
  function switchUserRole(role) {
    AppState.activeRole = role;
    const btnTeacher = document.getElementById('role-btn-teacher');
    const btnHeadmaster = document.getElementById('role-btn-headmaster');

    if (role === 'headmaster') {
      if (btnHeadmaster) {
        btnHeadmaster.className = 'px-2.5 py-1 rounded-lg transition bg-amber-600 text-white shadow-xs flex items-center gap-1';
      }
      if (btnTeacher) {
        btnTeacher.className = 'px-2.5 py-1 rounded-lg transition text-slate-500 hover:text-slate-800 flex items-center gap-1';
      }
      updateHeaderInfo();
      switchView('supervision');
      showToast('Beralih ke Portal Supervisi Kepala Sekolah', 'info');
    } else {
      if (btnTeacher) {
        btnTeacher.className = 'px-2.5 py-1 rounded-lg transition bg-white text-teal-800 shadow-xs flex items-center gap-1';
      }
      if (btnHeadmaster) {
        btnHeadmaster.className = 'px-2.5 py-1 rounded-lg transition text-slate-500 hover:text-slate-800 flex items-center gap-1';
      }
      updateHeaderInfo();
      switchView('dashboard');
      showToast('Beralih ke Portal Administrasi Guru', 'info');
    }
  }
</script>
